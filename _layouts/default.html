<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<main>

  <a class="lockup" href="{{ '/' | relative_url }}">
    <svg width="48" height="48" viewBox="10 30 216 216" aria-hidden="true">
      <defs>
        <linearGradient id="lens" x1="56" y1="136" x2="144" y2="78" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4A9FE8"></stop>
          <stop offset="0.52" stop-color="#22B5A0"></stop>
          <stop offset="1" stop-color="#3DD07A"></stop>
        </linearGradient>
      </defs>
      <g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M78 168L76 208M122 168L124 208" stroke-width="15"></path>
        <path d="M41 136Q26 150 22 170M159 130Q180 120 186 96"></path>
        <path d="M40 94V62A18 18 0 0 1 58 44H84M116 44H142A18 18 0 0 1 160 62V94M40 122V152A18 18 0 0 0 58 170H84M116 170H142A18 18 0 0 0 160 152V122"></path>
      </g>
      <ellipse cx="74" cy="216" rx="19" ry="9.5" fill="currentColor"></ellipse>
      <ellipse cx="126" cy="216" rx="19" ry="9.5" fill="currentColor"></ellipse>
      <path d="M56 107C74 78 126 78 144 107 126 136 74 136 56 107Z" fill="url(#lens)"></path>
      <circle cx="100" cy="107" r="19" fill="#F2F7FC"></circle>
      <circle cx="102" cy="108" r="12" fill="#0E2338"></circle>
      <circle cx="106" cy="101" r="4.6" fill="#FFFFFF"></circle>
    </svg>
    <span class="wordmark">Prys<span>can</span></span>
  </a>

  <div class="rule"></div>

  {{ content }}

  <footer>
    <a href="{{ '/' | relative_url }}">Home</a> ·
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
    <a href="{{ '/support/' | relative_url }}">Support</a> ·
    Made in South Africa.
  </footer>

</main>
</body>
</html>
